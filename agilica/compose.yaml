# Two mutually exclusive drone-link profiles, plus independent add-ons:
#   COMPOSE_PROFILES=psdk      -> psdk_bridge, Agilica's PSDK module (the Pi/arm64 path)
#   COMPOSE_PROFILES=msdk      -> vitro_interface, Flanders Make's MSDK bridge
#   add ",uwb"                 -> also start agilica_uwb (needs the UWB module plugged in)
#   add ",gnc"                 -> also run VITRO (drone_gnc) here rather than on a laptop
#   add ",liveview"            -> also decode the camera stream to JPEG for the GUI/Foxglove
#
# Prefer driving these through start_demo.sh (use_psdk_msdk / use_uwb / vitro_location)
# rather than setting COMPOSE_PROFILES by hand - it also resolves the serial ports.
#
# Host serial devices come in as UWB_UART_DEV / PSDK_UART_DEV, resolved by USB
# product string in scripts/detect_serial.sh - both adapters are FTDI, so the
# ttyUSB* index depends on plug order and cannot be hardcoded. The fallbacks
# below are intentionally non-existent paths: compose interpolates every service
# regardless of the active profile, so a required-variable (:?) form would break
# the msdk path too, while a real device default risks opening the wrong port.
#
# The msdk services below stay pinned to the original x86_64 prod images. That
# path cannot run on the Pi: vitro_interface is native C++ built for x86_64 and
# we have no source for it. It is precisely what psdk_bridge replaces.

# Shared ROS 2 environment for the services that actually run on the Pi.
#
# When VITRO runs on a laptop (vitro_location=laptop, the default), that laptop must use the
# same ROS_DOMAIN_ID *and* the same ROS distro - ROS 2 does not support cross-distro
# communication, so a Jazzy Pi will not talk to a Humble laptop image.
#
# Every service uses host networking, so DDS multicast discovery works across the LAN
# unchanged. Where multicast is blocked, set VITRO_HOST to the laptop's IP; start_demo.sh
# passes it through as ROS_STATIC_PEERS and discovery falls back to unicast.
x-ros-env: &ros_env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
  ROS_STATIC_PEERS: ${ROS_STATIC_PEERS:-}

services:
  vitro_startup_config:
    container_name: vitro_startup_config
    profiles: ["msdk"]
    image: ghcr.io/flanders-make-vzw/vitro/drone_gnc_prod:v1.4.0
    network_mode: "host"
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - ./cfg/dji_interface.yaml:/root/ros2_ws/src/drone_gui/config/dji_interface.yaml
    command: >-
      python3 /root/ros2_ws/install/drone_gui/lib/python3.10/site-packages/drone_gui/ip_configurator.pyc
    depends_on:
      - mqtt_broker

  mqtt_broker:
    container_name: mqtt_broker
    restart: unless-stopped
    image: eclipse-mosquitto:2.0.18
    network_mode: "host"
    volumes:
      - ./cfg/mosquitto.conf:/mosquitto/config/mosquitto.conf

  vitro_dji_interface:
    container_name: vitro_dji_interface
    profiles: ["msdk"]
    image: ghcr.io/flanders-make-vzw/vitro/vitro_interface:v3.3.0
    network_mode: "host"
    volumes:
      - /dev/shm:/dev/shm
      - ./cfg/dji_interface.yaml:/root/ros2_ws/src/vitro_interface/cfg/config.yaml
    command: >-
      ros2 run vitro_interface vitro_interface_executor --ros-args -r __ns:=/dji 
                                                        --params-file /root/ros2_ws/src/vitro_interface/cfg/config.yaml
    depends_on:
      vitro_startup_config:
        condition: service_completed_successfully

  # NOT part of the default (headless) Pi stack - the arm64 image deliberately
  # omits the desktop/PyQt stack, and drone_gui is not grafted into it. Kept
  # behind a profile so it never starts by accident. To use the GUI, run this
  # service on an x86_64 laptop against the original prod image, pointed at the
  # Pi over the network.
  drone_gui:
    container_name: drone_gui
    profiles: ["gui"]
    # Defaults to tracking the GNC image so the two can never silently drift onto different
    # ROS distros - a Humble GUI and a Jazzy drone_gnc simply do not see each other.
    image: ${VITRO_GUI_IMAGE:-${VITRO_GNC_IMAGE:-ghcr.io/flanders-make-vzw/vitro/drone_gnc_prod:v1.4.0}}
    network_mode: "host"
    # Was list-form with only DISPLAY, so it inherited none of the shared ROS settings. That
    # happens to work on domain 0 with multicast, which is exactly why it went unnoticed:
    # set a non-zero ROS_DOMAIN_ID, or block multicast, and the GUI silently shows nothing.
    environment:
      <<: *ros_env
      DISPLAY: ${DISPLAY}
      # Root of the "Load WP file" dialog. Set explicitly rather than relying on ~ expansion,
      # because the GUI publishes the *absolute path* it picks and drone_gnc then opens that
      # same string - so both ends must agree on this prefix or the load silently fails.
      DRONE_CFG_HOME: /root/drone_cfg_home
      QT_X11_NO_MITSHM: 1
    volumes:
      - /dev/shm:/dev/shm
      - ./log/sundae:/root/log
      # DISPLAY alone is not enough - without the socket the GUI cannot reach any X server.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # cfg_file:=gui_cfg.yaml is passed below, but this mount used to be commented out, so
      # dev_gui fell back to its packaged gui_cfg_example.yaml without saying so.
      - ./cfg/gui_cfg.yaml:/root/drone_cfg_home/gui_cfg.yaml:ro
      # Same waypoint tree the Pi's drone_gnc mounts, at the same container path.
      - ./cfg/gnc/demo_agilica:/root/drone_cfg_home/demo_agilica:ro
    command: ros2 run drone_gui dev_gui --ros-args -r __ns:=/dji -p cfg_file:=gui_cfg.yaml

  # VITRO's fusion + control + mission layer. Behind the "gnc" profile because it runs on a
  # Runs on the Pi by default (vitro_location=pi). sensor_fusion and drone_control both
  # import the `sundae` package, which is absent from the extracted tree but IS present in
  # Flanders Make's arm64 bundle, ghcr.io/flanders-make-vzw/vitro/drone_gnc_prod:5.0.0dev-jazzy,
  # at /root/lib/SUNDAE - reachable only because that image's /entrypoint.sh puts it on
  # PYTHONPATH. start_demo.sh defaults VITRO_GNC_IMAGE to that bundle.
  #
  # Do not override the entrypoint when debugging this service: bypassing it leaves
  # PYTHONPATH unset and reproduces the original "No module named 'sundae'" failure.
  drone_gnc:
    container_name: drone_gnc
    profiles: ["gnc"]
    image: ${VITRO_GNC_IMAGE:-${VITRO_IMAGE:-vitro_arm64:jazzy}}
    environment:
      <<: *ros_env
      DISPLAY: ${DISPLAY}
      # Must match drone_gui's value - see the note there on waypoint path resolution.
      DRONE_CFG_HOME: /root/drone_cfg_home
    volumes:
      - /dev/shm:/dev/shm
      - ./log/sundae:/root/log
      - ./cfg/gnc/demo_agilica:/root/drone_cfg_home/demo_agilica
      - ./cfg/gnc/demo_agilica_launch.py:/demo_agilica_launch.py
    network_mode: "host"
    command: ros2 launch /demo_agilica_launch.py

  # Not part of the default run - the UWB positioning module is a later
  # integration step. Requires ./cfg/parser_params.yaml and the UWB unit to
  # actually be present; add "uwb" to COMPOSE_PROFILES once wired up.
  #
  # The module is an FTDI FT231X enumerating as /dev/ttyUSBn (NOT ttyACM0 - it is
  # not a CDC-ACM device). Host side is resolved at launch; container side stays
  # /dev/ttyAgilica to match the `port` in cfg/parser_params.yaml.
  agilica_uwb:
    container_name: agilica_uwb
    restart: unless-stopped
    profiles: ["uwb"]
    image: ${VITRO_IMAGE:-vitro_arm64:jazzy}
    environment:
      <<: *ros_env
    volumes:
      - /dev/shm:/dev/shm
      - ${UWB_UART_DEV:-/dev/uwb-not-detected}:/dev/ttyAgilica
      - ./log/sundae:/root/log
      - ./cfg/parser_params.yaml:/parser_params.yaml
      # Deploys src/nmea_parser without rebuilding the image. The image's installed copy
      # was verified byte-identical to this file on 2026-09-23 apart from the throttled
      # warnings, so the mount carries only that fix. Rebuilding vitro_arm64:jazzy instead
      # would also activate the pending body-frame setpoint change in psdk_bridge; this
      # keeps the two independent. The target is the Jazzy image's python3.12 path, so
      # under ros_distro=humble it is simply ignored.
      - ../src/nmea_parser/nmea_parser/nmea_parser.py:/root/ros2_ws/install/nmea_parser/lib/python3.12/site-packages/nmea_parser/nmea_parser.py:ro
    privileged: true
    network_mode: "host"
    command: ros2 launch nmea_parser parser.launch.py params_file:=/parser_params.yaml

  # Records the interface topics rather than `-a`. On a Pi 4 (3.7 GB RAM, ~12 GB free disk)
  # recording every topic alongside the bridge, the parser and - later - a 40 Hz EKF costs
  # real CPU and fills the card fast. Add topics here as the interface grows; the previous
  # `-a -x '(.*)image(.*)'` form is the fallback if you need a broad capture while debugging.
  ros_log_record:
    container_name: ros_log_record
    image: ${VITRO_IMAGE:-vitro_arm64:jazzy}
    environment:
      <<: *ros_env
    volumes:
      - ./log/ros:/root/bag_record
      - /dev/shm:/dev/shm
    network_mode: "host"
    working_dir: /root/bag_record
    # --regex (not a fixed topic list) so topics that appear after the recorder starts - which
    # is normal here, since the bridge takes a moment to connect - are still picked up.
    # The exclude flag is spelled -x on Humble and --exclude-regex on Jazzy, and each distro
    # rejects the other's spelling. start_demo.sh sets ROSBAG_EXCLUDE_FLAG from ros_distro;
    # the -x default keeps the Humble rollback path working from this same file. Hardcoding
    # either spelling means recording silently stops on the other distro.
    #
    # The exclude pattern covers both video topics: `image` catches the decoded JPEG frames
    # and `h264` catches the raw liveview stream feeding them. h264 does not contain the
    # word "image", so without it a liveview run writes ~4 Mbps straight into the bag.
    #
    # /dji/sm is excluded too: it is mission_ctrl's state-machine diagram, re-rendered by
    # graphviz and published as a JPEG 2-3 times a second - a picture, not flight data.
    # Its name contains neither "image" nor "h264", so it slipped past the video filter
    # and was being written to the card continuously (measured 2026-09-23).
    #
    # --max-bag-size caps a single bag at 512 MB. Once drone_gnc runs on the Pi the recorder
    # also captures the 40 Hz /dji/gnc/... fusion topics and growth roughly triples; this
    # card has already been filled to 100% once.
    command: >-
      ros2 bag record -s mcap
      --regex '^/(agilica_pose|dji/.*)$'
      ${ROSBAG_EXCLUDE_FLAG:--x} '(.*)(image|h264)(.*)|^/dji/sm$'
      --max-bag-size ${ROSBAG_MAX_BAG_SIZE:-536870912}

  psdk_bridge:
    container_name: psdk_bridge
    restart: unless-stopped
    profiles: ["psdk"]
    image: ${VITRO_IMAGE:-vitro_arm64:jazzy}
    network_mode: "host"
    environment:
      <<: *ros_env
      DISPLAY: ${DISPLAY}
      # DJI developer app credentials (create/obtain at https://developer.dji.com/user/apps).
      # Export these in the host shell (or a .env file next to this compose.yaml) before
      # `use_psdk_msdk=0 ./start_demo.sh` - psdk_wrapper refuses to connect without them.
      PSDK_APP_NAME: ${PSDK_APP_NAME:-}
      PSDK_APP_ID: ${PSDK_APP_ID:-}
      PSDK_APP_KEY: ${PSDK_APP_KEY:-}
      PSDK_APP_LICENSE: ${PSDK_APP_LICENSE:-}
      PSDK_DEV_ACCOUNT: ${PSDK_DEV_ACCOUNT:-}
      PSDK_BAUD_RATE: ${PSDK_BAUD_RATE:-460800}
      PSDK_UART_DEV1: /dev/ttyUSB0
      PSDK_LIB_PATH: /root/ros2_ws/install/psdk_wrapper/lib/libpsdk_wrapper.so
      # Only read when the network handler is registered. PSDK passes these to the
      # aircraft as the VID/PID of the USB network adapter it should bind for the
      # high-speed (liveview) channel - see hal_network.h. Overridable so the value can
      # be swept against a live aircraft without rebuilding the image.
      PSDK_NET_VID: ${PSDK_NET_VID:-}
      PSDK_NET_PID: ${PSDK_NET_PID:-}
      PSDK_NET_DEV: ${PSDK_NET_DEV:-}
    devices:
      # UART link to the aircraft's payload port (E-Port/X-Port/SkyPort). Host side is
      # detected by USB product string (FTDI TTL232R-3V3) at launch; set PSDK_UART_DEV
      # in the shell or .env to pin a specific port instead.
      - "${PSDK_UART_DEV:-/dev/aircraft-uart-not-detected}:/dev/ttyUSB0"
    cap_add:
      - NET_ADMIN
    volumes:
      - /dev/shm:/dev/shm
      - ./log/sundae:/root/log
      - ./cfg/psdk_bridge_params.yaml:/psdk_bridge_params.yaml
    # psdk_wrapper and dji_psdk_bridge are compiled into vitro_arm64:jazzy at
    # image-build time, so there is no colcon build here - the static whole-archive
    # link against libpayloadsdk.a is slow on a Pi 4 and pointless to repeat on
    # every start. The entrypoint already sources ROS and the workspace.
    # Executable is "psdk_bridge", not "psdk_bridge_node" - that's the module
    # name inside setup.py's entry_points, the registered console script is
    # shorter (confirm with `ros2 pkg executables dji_psdk_bridge`).
    command: >-
      ros2 run dji_psdk_bridge psdk_bridge --ros-args -r __ns:=/dji
                                           --params-file /psdk_bridge_params.yaml
                                           ${PSDK_BRIDGE_EXTRA_ARGS:-}

  # Decodes liveview into pictures. psdk_bridge republishes the aircraft's H.264
  # elementary stream verbatim on /dji/camera_h264, and nothing that draws an image can
  # read that: drone_gui goes through cv_bridge -> cv2.imdecode (JPEG/PNG only) and
  # Foxglove's Image panel expects JPEG/PNG too. This node transcodes to JPEG on
  # /dji/camera/image/compressed, which both then display with no changes on their side.
  #
  # Separate service, separate process, behind its own profile - three deliberate choices:
  # it must be able to crash or be OOM-killed without touching the container that holds
  # joystick control authority; it is the only CPU-hungry thing in the stack, so it must be
  # trivially removable; and it can be moved to the laptop unchanged if the Pi ever needs
  # the cores back. Note that moving it there costs bandwidth rather than saving it: at the
  # shipped 5 fps / 960 px the JPEG output measures ~1.1 Mbps against the ~4 Mbps h264 it is
  # decoded from, so doing this on the Pi is currently the cheaper option on the wire too.
  #
  # Needs psdk_bridge's liveview_enabled to be true, otherwise nothing is published to
  # decode and this just idles. It also needs network_handler_enabled: true and the USB
  # gadget in place (scripts/setup_usb_gadget.sh) - without those, psdk_bridge logs 0xE0
  # and publishes nothing. Verified against the aircraft 14 Sep 2026: ~29 fps of H.264 in,
  # 960x720 JPEG at 5 fps out, ~15% of one Pi core.
  #
  # To use the Pi's hardware H.264 decoder, add
  #     devices: ["/dev/video10:/dev/video10"]
  # here and set hwaccel: "v4l2m2m" in cfg/liveview_decoder_params.yaml. Not the default:
  # /dev/video10 is Pi-specific (so it would break this service on a laptop) and the
  # VideoCore driver copes less gracefully with a stream that has lost bytes.
  liveview_decode:
    container_name: liveview_decode
    restart: unless-stopped
    profiles: ["liveview"]
    image: ${VITRO_IMAGE:-vitro_arm64:jazzy}
    environment:
      <<: *ros_env
    network_mode: "host"
    volumes:
      - /dev/shm:/dev/shm
      - ./cfg/liveview_decoder_params.yaml:/liveview_decoder_params.yaml
    # The Pi's VideoCore H.264 decoder. Harmless when hwaccel is empty (nothing opens it),
    # so it is mounted unconditionally rather than left as a commented-out block someone
    # has to remember. On a machine without /dev/video10 this service will not start -
    # override LIVEVIEW_VIDEO_DEV to a path that exists, e.g. /dev/null, if you run the
    # decoder on a laptop.
    devices:
      - "${LIVEVIEW_VIDEO_DEV:-/dev/video10}:/dev/video10"
    command: >-
      ros2 run dji_psdk_bridge liveview_decoder --ros-args -r __ns:=/dji
                                                --params-file /liveview_decoder_params.yaml

  # No `profiles:` key on purpose - unlike psdk/msdk/gui, this should start
  # alongside whichever drone link is active. Exposes the live ROS graph
  # (position, battery, attitude, ...) to Foxglove Studio (app.foxglove.dev, or
  # the desktop app) from any laptop on the same network: connect to
  # ws://<pi-ip>:8765. With the "liveview" profile also running, Foxglove's Image panel
  # renders /dji/camera/image/compressed directly - the raw /dji/camera_h264 topic it
  # is decoded from is not displayable by anything.
  foxglove_bridge:
    container_name: foxglove_bridge
    restart: unless-stopped
    image: ${VITRO_IMAGE:-vitro_arm64:jazzy}
    environment:
      <<: *ros_env
    network_mode: "host"
    volumes:
      - /dev/shm:/dev/shm
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765
