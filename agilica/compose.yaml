# Two mutually exclusive drone-link profiles, plus an independent add-on:
#   COMPOSE_PROFILES=psdk      -> psdk_bridge, Agilica's PSDK module (the Pi/arm64 path)
#   COMPOSE_PROFILES=msdk      -> vitro_interface, Flanders Make's MSDK bridge
#   add ",uwb"                 -> also start agilica_uwb (needs /dev/ttyACM0 present)
#
# The msdk services below stay pinned to the original x86_64 prod images. That
# path cannot run on the Pi: vitro_interface is native C++ built for x86_64 and
# we have no source for it. It is precisely what psdk_bridge replaces.
services:
  vitro_startup_config:
    container_name: vitro_startup_config
    profiles: ["msdk"]
    image: ghcr.io/flanders-make-vzw/vitro/drone_gnc_prod:v1.4.0
    network_mode: "host"
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - ./cfg/dji_interface.yaml:/root/ros2_ws/src/drone_gui/config/dji_interface.yaml
    command: >-
      python3 /root/ros2_ws/install/drone_gui/lib/python3.10/site-packages/drone_gui/ip_configurator.pyc
    depends_on:
      - mqtt_broker

  mqtt_broker:
    container_name: mqtt_broker
    image: eclipse-mosquitto:2.0.18
    network_mode: "host"
    volumes:
      - ./cfg/mosquitto.conf:/mosquitto/config/mosquitto.conf

  vitro_dji_interface:
    container_name: vitro_dji_interface
    profiles: ["msdk"]
    image: ghcr.io/flanders-make-vzw/vitro/vitro_interface:v3.3.0
    network_mode: "host"
    volumes:
      - /dev/shm:/dev/shm
      - ./cfg/dji_interface.yaml:/root/ros2_ws/src/vitro_interface/cfg/config.yaml
    command: >-
      ros2 run vitro_interface vitro_interface_executor --ros-args -r __ns:=/dji 
                                                        --params-file /root/ros2_ws/src/vitro_interface/cfg/config.yaml
    depends_on:
      vitro_startup_config:
        condition: service_completed_successfully

  # NOT part of the default (headless) Pi stack - the arm64 image deliberately
  # omits the desktop/PyQt stack, and drone_gui is not grafted into it. Kept
  # behind a profile so it never starts by accident. To use the GUI, run this
  # service on an x86_64 laptop against the original prod image, pointed at the
  # Pi over the network.
  drone_gui:
    container_name: drone_gui
    profiles: ["gui"]
    image: ghcr.io/flanders-make-vzw/vitro/drone_gnc_prod:v1.4.0
    network_mode: "host"
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /dev/shm:/dev/shm
      - ./log/sundae:/root/log
      # - ./cfg/gui_cfg.yaml:/root/drone_cfg_home/gui_cfg.yaml
    command: ros2 run drone_gui dev_gui --ros-args -r __ns:=/dji -p cfg_file:=gui_cfg.yaml

  drone_gnc:
    container_name: drone_gnc
    image: vitro_arm64:humble
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /dev/shm:/dev/shm
      - ./log/sundae:/root/log
      - ./cfg/gnc/demo_agilica:/root/drone_cfg_home/demo_agilica
      - ./cfg/gnc/demo_agilica_launch.py:/demo_agilica_launch.py
    network_mode: "host"
    command: ros2 launch /demo_agilica_launch.py

  # Not part of the default run - the UWB positioning module is a later
  # integration step. Requires ./cfg/parser_params.yaml and /dev/ttyACM0 (the
  # UWB unit) to actually be present; add "uwb" to COMPOSE_PROFILES once wired up.
  agilica_uwb:
    container_name: agilica_uwb
    profiles: ["uwb"]
    image: vitro_arm64:humble
    volumes:
      - /dev/shm:/dev/shm
      - /dev/ttyACM0:/dev/ttyAgilica
      - ./log/sundae:/root/log
      - ./cfg/parser_params.yaml:/parser_params.yaml
    privileged: true
    network_mode: "host"
    command: ros2 launch nmea_parser parser.launch.py params_file:=/parser_params.yaml

  ros_log_record:
    container_name: ros_log_record
    image: vitro_arm64:humble
    volumes:
      - ./log/ros:/root/bag_record
      - /dev/shm:/dev/shm
    network_mode: "host"
    working_dir: /root/bag_record
    command: ros2 bag record -a -s mcap -x '(.*)image(.*)'

  psdk_bridge:
    container_name: psdk_bridge
    profiles: ["psdk"]
    image: vitro_arm64:humble
    network_mode: "host"
    environment:
      - DISPLAY=${DISPLAY}
      # DJI developer app credentials (create/obtain at https://developer.dji.com/user/apps).
      # Export these in the host shell (or a .env file next to this compose.yaml) before
      # `use_psdk_msdk=0 ./start_demo.sh` - psdk_wrapper refuses to connect without them.
      - PSDK_APP_NAME=${PSDK_APP_NAME:-}
      - PSDK_APP_ID=${PSDK_APP_ID:-}
      - PSDK_APP_KEY=${PSDK_APP_KEY:-}
      - PSDK_APP_LICENSE=${PSDK_APP_LICENSE:-}
      - PSDK_DEV_ACCOUNT=${PSDK_DEV_ACCOUNT:-}
      - PSDK_BAUD_RATE=${PSDK_BAUD_RATE:-460800}
      - PSDK_UART_DEV1=/dev/ttyUSB0
      - PSDK_LIB_PATH=/root/ros2_ws/install/psdk_wrapper/lib/libpsdk_wrapper.so
    devices:
      # UART link to the aircraft's payload port (E-Port/X-Port/SkyPort). Override the
      # host side via PSDK_UART_DEV if your adapter doesn't enumerate as ttyUSB0.
      - "${PSDK_UART_DEV:-/dev/ttyUSB0}:/dev/ttyUSB0"
    volumes:
      - /dev/shm:/dev/shm
      - ./log/sundae:/root/log
    # psdk_wrapper and dji_psdk_bridge are compiled into vitro_arm64:humble at
    # image-build time, so there is no colcon build here - the static whole-archive
    # link against libpayloadsdk.a is slow on a Pi 4 and pointless to repeat on
    # every start. The entrypoint already sources ROS and the workspace.
    # Executable is "psdk_bridge", not "psdk_bridge_node" - that's the module
    # name inside setup.py's entry_points, the registered console script is
    # shorter (confirm with `ros2 pkg executables dji_psdk_bridge`).
    command: ros2 run dji_psdk_bridge psdk_bridge --ros-args -r __ns:=/dji

  # No `profiles:` key on purpose - unlike psdk/msdk/gui, this should start
  # alongside whichever drone link is active. Exposes the live ROS graph
  # (position, battery, attitude, ...) to Foxglove Studio (app.foxglove.dev, or
  # the desktop app) from any laptop on the same network: connect to
  # ws://<pi-ip>:8765. Telemetry/plots only - no video, since the PSDK bridge
  # does not publish a camera topic (see psdk_wrapper/README.md TODOs).
  foxglove_bridge:
    container_name: foxglove_bridge
    image: vitro_arm64:humble
    network_mode: "host"
    volumes:
      - /dev/shm:/dev/shm
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765
