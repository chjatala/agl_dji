# psdk_bridge - the Agilica PSDK module's side of the VITRO ROS2 interface.
#
# Applies to the node however it is namespaced (compose runs it under /dji), hence the
# /**/ wildcard, matching the style of cfg/dji_interface.yaml.
/**/psdk_bridge:
  ros__parameters:

    # ---- topic naming -----------------------------------------------------------------
    # false (default) -> the names currently deployed and consumed by
    #                    cfg/gnc/demo_agilica/sf_config.yaml: drone/pos, drone/spd,
    #                    drone/attitude, height_from_ground, battery, gimbal_attitude.
    # true            -> the names in "ROS2 Interface - VITRO Framework 0.0.1":
    #                    data/drone/location, data/drone/velocity_global, ...
    #
    # Which one VITRO actually subscribes is still an open question with Flanders Make
    # (Jia Wan said the documentation is unclear and that he will update it), so this is
    # deliberately a switch rather than a decision baked into the code.
    use_documented_topic_names: false

    # Per-topic overrides. Empty means "use whichever table the flag above selected".
    # Names without a leading "/" are relative and pick up the node's namespace (/dji);
    # prefix with "/" to publish at the root instead. The interface document writes the
    # names with a leading slash, but VITRO's own sf_config.yaml mixes relative
    # (drone/attitude) and absolute (/agilica_pose), so neither can be assumed.
    topic_location: ""
    topic_velocity: ""
    topic_attitude: ""
    topic_gimbal_angle: ""
    topic_height_above_ground: ""
    topic_battery_state: ""
    topic_log: ""
    topic_setpoint: ""
    topic_action: ""
    topic_camera_h264: ""

    # Service name overrides, same convention. Note "gimball_angle_service" is spelled
    # with two l's in the VITRO documentation and in the .srv filename; that spelling is
    # the contract and is kept verbatim.
    service_enable_automatic_navigation: ""
    service_disable_automatic_navigation: ""
    service_gimbal_angle: ""
    service_save_photo: ""
    service_video_settings: ""
    service_liveview_keyframe: ""

    # ---- rates ------------------------------------------------------------------------
    # psdk_wrapper subscribes the flight-controller topics at 5 Hz and the battery at 1 Hz
    # (see PsdkWrapper_SubscribeTelemetry). Publishing faster only repeats cached values
    # and would present VITRO's EKF with data that looks higher-rate than it is. To go
    # faster, raise DJI_DATA_SUBSCRIPTION_TOPIC_*_HZ in psdk_wrapper.c first - QUATERNION
    # and VELOCITY both support up to 200 Hz.
    telemetry_rate: 5.0
    battery_rate: 1.0

    # ---- liveview --------------------------------------------------------------------
    # Publishes raw H.264 elementary-stream chunks as sensor_msgs/CompressedImage
    # (format "h264") on topic_camera_h264. Position/source 1 selects the Mavic 3E
    # visible-light camera; position 7 selects the FPV camera on supported airframes.
    #
    # Nothing can display h264. To see the picture, also start the "liveview" compose
    # profile: liveview_decode transcodes this stream to JPEG on
    # /dji/camera/image/compressed, which drone_gui and Foxglove both render.
    #
    # WORKING as of 14 Sep 2026, verified against the aircraft: H.264 arrives at ~29 fps
    # and ~800 KiB/s, and liveview_decode turns it into 960x720 JPEG at 5 fps while
    # telemetry and control carry on untouched.
    #
    # It needs network_handler_enabled: true (below) AND the USB gadget wiring - the Pi
    # has to be a USB device on the aircraft's E-Port. Run
    # agilica/scripts/setup_usb_gadget.sh --check if the picture ever stops arriving; a
    # 0xE0 NONSUPPORT in psdk_bridge's log with healthy telemetry means the gadget is
    # missing, which is what a reboot without the systemd unit looks like.
    #
    # One harmless error to expect: SetEncodingStrategy(4000 kbps) returns 0xE0 on this
    # airframe, so liveview_bitrate_kbps below is ignored and the aircraft streams at its
    # own default (~6.5 Mbps measured). Everything still works; only the bitrate request
    # is refused.
    liveview_enabled: true
    liveview_position: 1
    liveview_source: 1
    liveview_bitrate_kbps: 4000
    liveview_drain_rate: 100.0

    # ---- PSDK network handler ---------------------------------------------------------
    # Required for liveview, and safe to leave on: it registers the HAL that brings up the
    # E-Port's RNDIS high-speed channel, which is the only path the camera's H.264 can
    # take. PSDK addresses it itself (observed: 192.168.90.2/255.255.0.0 on usb0).
    #
    # This was false for three weeks and is worth stating plainly, because the old advice
    # was the exact opposite. Registering the handler used to make DjiCore_Init fail with
    # 0xE1 and take the flight link with it - measured repeatedly - and that was written
    # up as an unfixable PSDK limitation. The real cause was cabling: the aircraft was on
    # a Pi USB-A port, so the Pi was the USB host, which is the wrong role for M3E. With
    # the wiring DJI documents, the same code connects first time and telemetry, control
    # and video all coexist.
    #
    # If this ever starts failing with 0xE1 again, suspect the USB gadget before the code:
    # agilica/scripts/setup_usb_gadget.sh --check.
    network_handler_enabled: true

    # ---- safety -----------------------------------------------------------------------
    # If setpoints stop arriving while a command is still latched, command hover rather
    # than letting the aircraft hold the last velocity indefinitely. This matters most in
    # the interim split deployment, where VITRO runs on a laptop and the control loop
    # crosses WiFi.
    setpoint_watchdog_enabled: true
    setpoint_timeout: 0.5

    # When true, setpoints are only forwarded between enable_automatic_navigation and
    # disable_automatic_navigation. Off by default so behaviour is unchanged for callers
    # that drive cmd/drone/setpoint directly without using the services.
    require_automatic_navigation: false

    # ---- flight control authority -----------------------------------------------------
    # DJI requires ObtainJoystickCtrlAuthority before any setpoint is acted on
    # (dji_flight_controller.h: "You have to obtain joystick control permission
    # successfully before you using joystick to control aircraft. RC must be in p-mode").
    #
    # Only the 'arm' command called it, and VITRO's interface has no 'arm' - it defines
    # takeoff/land only. So setpoints streamed to an aircraft that had never granted
    # authority and were silently discarded: takeoff and land worked, motion did not, and
    # nothing logged an error because ExecuteJoystickAction returns success regardless.
    #
    # true (default): acquire authority before takeoff and whenever a setpoint stream
    # starts without it. false: require an explicit 'arm' on cmd/drone/action first.
    auto_obtain_authority: true
    authority_retry_interval: 1.0

    # ---- setpoint yaw units ------------------------------------------------------------
    # GlobalPositionTarget carries BOTH `yaw` (absolute angle) and `yaw_rate`. The joystick
    # runs in YAW_ANGLE_RATE_CONTROL_MODE, so the rate is the meaningful one - and it is the
    # one VITRO populates. Measured over 38601 recorded setpoints: `yaw` was 0.0 in every
    # single message, `yaw_rate` was non-zero in 38423. The bridge previously read `yaw`,
    # so it commanded a constant zero yaw rate and the aircraft never turned.
    #
    # false (default): treat incoming yaw_rate as rad/s and convert to the deg/s DJI wants
    # (dji_flight_controller.h: "Limit: -150 deg/s to 150 deg/s"). Replaying the recorded
    # setpoints through this gives a peak of exactly 30.00 deg/s - a clean clamp on VITRO's
    # side, which corroborates rad/s input. Without the conversion, commands go out ~57x
    # too slow.
    #
    # true: the sender already uses deg/s. Confirm empirically before setting this -
    # command a known rate and time a 90 degree turn.
    setpoint_yaw_rate_is_degrees: false

    # Negate the yaw-rate command on its way to DJI. Leave false unless the aircraft
    # turns the wrong way under the body-frame interface: that change made x/y FLU but
    # did not touch yaw, and DJI's own convention is clockwise-positive seen from above.
    # Judge it from the joystick_command debug topic against d(Psi)/dt, not by eye.
    # Read once at startup - after changing it:  docker restart psdk_bridge
    setpoint_yaw_rate_invert: true
